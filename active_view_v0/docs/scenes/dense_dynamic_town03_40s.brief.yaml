# Retrospective contract of the current reference YAML, not a newly verified run.
# Confirm actual junction IDs, traffic lights and motion in CARLA before promotion.
schema_version: 1
scene_id: dense_dynamic_town03_40s_v14
status: draft
source_config: configs/dense_dynamic_town03_40s.yaml
map: Town03
seed: 42
coordinates: {world: CARLA_xyz_m, driving: vehicle_forward_right_m, evaluation: ego_moving}
junctions:
  J1: {junction_id: null, selection: corridor_rank_0, center_world_xy_m: null}
  J2: {junction_id: null, selection: same_connected_pair, center_world_xy_m: null}
ego:
  role: regional_ego
  start: {from: corridor_route_start, advance_m: 0}
  route: [{junction: J1, maneuver: straight}, {junction: J2, maneuver: straight}]
  speed_difference_pct: 0
  checkpoints:
    - {time_s: 0, expected_position: before_J1}
    - {time_s: 20, expected_position: moving_toward_J2}
agents:
