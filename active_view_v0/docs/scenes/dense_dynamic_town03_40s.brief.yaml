clock: {warmup_s: 2, duration_s: 40, sensor_interval_s: 0.1, saved_frames: 400, decision_interval_s: 1}
perception:
  roi_forward_m: [-100, 100]
  roi_right_m: [-60, 60]
  gt_classes: [car, pedestrian, two_wheeler]
  base_sensors: [ego_lidar, cav2_lidar, rsu_lidar]
acceptance:
  minimum_targets_per_frame: 18
  minimum_mean_targets: 22
  minimum_ego_displacement_m: 70
  visual_checkpoint_times_s: [0, 10, 20, 30, 39.9]
  detector_metrics: [AP30, AP50, recall50]
notes: "J1 opposite light and all observed motions must be checked on the current commit before this brief is approved."
