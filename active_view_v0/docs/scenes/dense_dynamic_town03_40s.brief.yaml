traffic_groups:
  - {name: j2_cross, route: j2_cross, planned_count: 5, includes_moving_blocker: true}
  - {name: j2_reverse, route: j2_cross_reverse, planned_count: 6}
  - {name: j1_cross, route: j1_cross, planned_count: 3}
  - {name: corridor_forward, route: corridor_forward, planned_count: 6, includes_moving_blocker: true}
  - {name: corridor_rear, route: corridor_behind_ego, planned_count: 2}
  - {name: corridor_oncoming, route: corridor_oncoming, planned_count: 9}
  - {name: randomized_background, planned_count: 10}
signals:
  - {junction: J1, time_s: [0, 40], ego_direction: green, opposite: unconfirmed, transverse: red}
  - {junction: J2, time_s: [0, 20], along_corridor: red, transverse: green}
