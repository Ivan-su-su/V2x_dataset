# Shared settings for the registered 60 s Town05 scenes. Use activeview --scene.
# Lane traffic and junctions are supplied by each scene.yaml.
carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 60.0
  map: Town05
  fixed_delta_seconds: 0.1
  traffic_manager_port: 8000
  seed: 42
regional:
  junction_1_id: null
  junction_2_id: null
  corridor_rank: 0
  min_junction_separation_m: 30.0
  max_junction_separation_m: 120.0
  warmup_s: 2.0
  duration_s: 60.0
  collection_interval_s: 0.1
  frame_count: 600
  include_endpoint: false
  snapshot_times_s:
  - 0.0
  - 15.0
  - 30.0
  - 45.0
  - 59.9
  enable_j1_cav: false
  agent_sensors:
    regional_ego: ego_lidar
    regional_car3: cav2_lidar
  tracked_roles:
  - regional_ego
  - regional_car3
  background_vehicle_count: 0
  minimum_background_spawned: 0
  background_spawn_radius_m: 165.0
  fixed_signal_plan:
    enabled: false
  density_validation:
    minimum_targets_per_frame: 12
    maximum_targets_per_frame: 25
    target_band_min_fraction: 0.8
    target_median_band: [16, 22]
    minimum_ego_displacement_m: 110
    minimum_mean_ego_speed_mps: 1.8
    minimum_agent_progress_per_quarter_m: 10
    maximum_stopped_s: 25
  validation:
    early_end_s: 20.0
    late_start_s: 40.0
    minimum_late_targets: 7
    minimum_rescue_frames_per_phase: 20
    minimum_directional_row_shift: 1
    minimum_transient_inside_frames: 20
    minimum_transient_outside_frames: 20
    minimum_transient_exit_shift_m: 20.0
    minimum_occlusion_frames: 20
    minimum_occlusion_rescue_frames: 10
    minimum_targets_per_frame_median: 7
    minimum_missed_instances_per_phase: 20
    minimum_rescuable_instances_per_phase: 10
    minimum_dynamic_extra_rescues: 5
    minimum_dynamic_recall_gain_pp: 1.0
    minimum_dynamic_movement_m: 15.0
  rsu:
    offset_forward_m: 0.0
    offset_right_m: -18.0
    height_m: 7.0
  uav_grid_offset_forward_m: -8.0
  uav_grid_offset_right_m: 0.0
  uav_modes:
    decision_interval_s: 1.0
    initial_candidate: uav_r2_c2
    tracking_forward_offset_m: 25.0
    tracking_right_offset_m: 0.0
    patrol_candidates:
    - uav_r2_c2
    - uav_r2_c3
    - uav_r2_c4
    - uav_r1_c4
    - uav_r0_c4
    - uav_r0_c3
    - uav_r0_c2
    - uav_r1_c2
    - uav_r2_c2
    - uav_r3_c2
    - uav_r4_c2
    - uav_r4_c1
    - uav_r4_c0
    - uav_r3_c0
    - uav_r2_c0
  bev_margin_m: 35.0
  bev_camera:
    height_m: 165.0
    image_size_x: 1800
    image_size_y: 1500
    fov: 105.0
  save_overhead_rgb: false
  annotated_bev:
    enabled: false
    make_video: false
    video_fps: 10.0
    video_filename: global_bev_rgb_annotated.mp4
    video_codec: libx264
    video_quality: 8
  native_signal_cycle_s:
    green: 8.0
    yellow: 2.0
    red: 1.0
  support_vehicles: []
  lane_traffic: null
grid:
  size: 5
  spacing_m: 15.0
  height_m: 40.0
  keyframe_interval_s: 1.0
sensors:
  vehicle_lidar:
    mount:
      x: 0.0
      y: 0.0
      z: 1.8
      pitch: 0.0
      yaw: 0.0
      roll: 0.0
    channels: 80
    range: 80.0
    points_per_second: 400000
    rotation_frequency: 10.0
    upper_fov: 15.0
    lower_fov: -25.0
  rsu_lidar:
    channels: 64
    range: 80.0
    points_per_second: 300000
    rotation_frequency: 10.0
    upper_fov: 10.0
    lower_fov: -40.0
  uav_lidar:
    channels: 64
    range: 80.0
    points_per_second: 200000
    rotation_frequency: 10.0
    upper_fov: -5.0
    lower_fov: -90.0
scoring:
  roi_mode: ego_moving
  ego_roi:
    min:
    - -140.8
    - -40.0
    max:
    - 140.8
    - 40.0
  regional_roi:
    center_offset_forward_m: 0.0
    center_offset_right_m: 0.0
    forward_m:
    - -110.0
    - 110.0
    right_m:
    - -60.0
    - 60.0
  base_sensors:
  - ego_lidar
  - cav2_lidar
  - rsu_lidar
  ignore_roles:
  - regional_ego
  - regional_car3
  threshold_points:
    car: 8
    pedestrian: 3
    two_wheeler: 5
  class_weights:
    car: 1.0
    pedestrian: 2.0
    two_wheeler: 1.5
  quality_tau_points:
    car: 40.0
    pedestrian: 12.0
    two_wheeler: 20.0
  box_margin_m: 0.15
  gain_weight: 0.5
  detector_lidar_range:
  - -140.8
  - -40.0
  - -3.0
  - 140.8
  - 40.0
  - 1.0
oracle:
  uav_speed_mps: 15.0
  movement_penalty_per_m: 0.01
  recovery_quality_tiebreak: 0.0001
