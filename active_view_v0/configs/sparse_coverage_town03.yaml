# v0.9 main pilot: three CAVs + one RSU + one active UAV over a fixed regional ROI.
carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  map: Town03
  fixed_delta_seconds: 0.1
  traffic_manager_port: 8000
  seed: 42

output:
  root: /mnt/disk_4/suyi/active_airv2x/datasets/active_view_v0
  run_name: sparse_coverage_town03_v09_001

regional:
  junction_1_id: null
  junction_2_id: null
  corridor_rank: 0
  min_junction_separation_m: 30.0
  max_junction_separation_m: 120.0

  warmup_s: 3.0
  duration_s: 30.0
  snapshot_times_s: [0.0, 6.0, 12.0, 18.0, 24.0, 30.0]

  # Exactly three cooperative vehicles are sensor agents. Background/support
  # vehicles are ordinary detection targets and never contribute point clouds.
  background_vehicle_count: 12
  background_spawn_radius_m: 160.0
  route_exit_distance_m: 55.0
  ego_route_tail_m: 220.0
  ego_speed_difference_pct: 65.0
  car1_start_before_junction_m: 60.0
  car1_speed_difference_pct: 20.0

  # CAV-3 approaches J2 during warmup, temporarily covers it, then follows a
  # long legal tail out of the UAV service region. No actor is spawned mid-run.
  car3_start_before_junction_m: 65.0
  car3_speed_difference_pct: -10.0
  car3_route_tail_m: 140.0
  transient_coverage_radius_m: 60.0

  # Deterministic ordinary targets keep traffic demand on both sides of J2.
  support_vehicles:
    - {role: regional_east_front, route: j2_cross, start_offset_m: 20.0, speed_difference_pct: 18.0}
    - {role: regional_east_rear, route: j2_cross, start_offset_m: 48.0, speed_difference_pct: 28.0}
    - {role: regional_late_1, route: corridor_behind_ego, start_offset_m: 85.0, speed_difference_pct: -5.0}
    - {role: regional_late_2, route: corridor_behind_ego, start_offset_m: 110.0, speed_difference_pct: 0.0}
    - {role: regional_late_3, route: corridor_behind_ego, start_offset_m: 135.0, speed_difference_pct: 5.0}

  validation:
    early_end_s: 10.0
    late_start_s: 14.0
    minimum_late_targets: 8
    minimum_rescue_frames_per_phase: 2
    minimum_directional_row_shift: 1
    minimum_transient_inside_frames: 2
    minimum_transient_outside_frames: 2
    minimum_transient_exit_shift_m: 30.0

  rsu:
    offset_forward_m: 0.0
    offset_right_m: -18.0
    height_m: 7.0

  # Shift the 5x5 grid 15m from J2 toward J1. Its forward rows therefore span
  # the corridor side and J2 side instead of representing only J2 center.
  uav_grid_offset_forward_m: -15.0
  uav_grid_offset_right_m: 0.0

  bev_margin_m: 25.0
  bev_camera:
    height_m: 150.0
    image_size_x: 1800
    image_size_y: 1400
    fov: 100.0
  save_overhead_rgb: true

grid:
  size: 5
  spacing_m: 10.0
  height_m: 25.0
  keyframe_interval_s: 2.0

sensors:
  vehicle_lidar:
    mount: {x: 0.0, y: 0.0, z: 1.8, pitch: 0.0, yaw: 0.0, roll: 0.0}
    channels: 32
    range: 80.0
    points_per_second: 200000
    rotation_frequency: 10.0
    upper_fov: 10.0
    lower_fov: -30.0
  rsu_lidar:
    channels: 64
    range: 100.0
    points_per_second: 300000
    rotation_frequency: 10.0
    upper_fov: 10.0
    lower_fov: -40.0
  uav_lidar:
    channels: 64
    range: 80.0
    points_per_second: 200000
    rotation_frequency: 10.0
    upper_fov: -5.0
    lower_fov: -90.0

scoring:
  # Fusion can still transform all features into the current Ego frame, but
  # target membership is fixed in this road-aligned world region.
  roi_mode: regional_fixed
  regional_roi:
    center_offset_forward_m: 0.0
    center_offset_right_m: 0.0
    forward_m: [-110.0, 110.0]
    right_m: [-60.0, 60.0]
  # Retained for old tools and comparison runs; unused when roi_mode is regional_fixed.
  ego_roi:
    min: [-140.8, -40.0]
    max: [140.8, 40.0]
  base_sensors: [ego_lidar, car1_lidar, car3_lidar, rsu_lidar]
  ignore_roles: [regional_ego, regional_car1, regional_car3]
  threshold_points: {car: 8, pedestrian: 3, two_wheeler: 5}
  class_weights: {car: 1.0, pedestrian: 2.0, two_wheeler: 1.5}
  quality_tau_points: {car: 40.0, pedestrian: 12.0, two_wheeler: 20.0}
  box_margin_m: 0.15
  gain_weight: 0.5

oracle:
  uav_speed_mps: 5.0
  movement_penalty_per_m: 0.002
