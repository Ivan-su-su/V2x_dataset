# v1.0 pilot: two cooperative vehicles + one RSU + one active UAV.
# Griffin alignment is limited to the ground LiDAR scan rate / vertical FoV and
# the 25 m altitude subset. Griffin's UAV is camera-only, so uav_lidar remains
# an explicit Active AirV2X simulation extension rather than a claimed replica.
carla:
  host: 127.0.0.1
  port: 2000
  timeout_s: 30.0
  map: Town03
  fixed_delta_seconds: 0.1
  traffic_manager_port: 8000
  seed: 42

output:
  root: /mnt/disk_4/suyi/active_airv2x/datasets/active_view_v0
  run_name: active_occlusion_town03_v10_001

regional:
  junction_1_id: null
  junction_2_id: null
  corridor_rank: 0
  min_junction_separation_m: 30.0
  max_junction_separation_m: 120.0

  warmup_s: 3.0
  duration_s: 30.0
  snapshot_times_s: [0.0, 5.0, 10.0, 15.0, 20.0, 25.0, 30.0]

  # Exactly two moving sensor vehicles. CAV-2 traverses J2 behind a bus.
  enable_j1_cav: false
  agent_sensors:
    regional_ego: ego_lidar
    regional_car3: cav2_lidar
  tracked_roles:
    - regional_ego
    - regional_car3
    - regional_cav2_blocker
    - regional_cav2_front_1
    - regional_cav2_front_2

  background_vehicle_count: 6
  background_spawn_radius_m: 165.0
  route_exit_distance_m: 100.0
  ego_route_tail_m: 220.0
  ego_speed_difference_pct: 75.0

  # Positive Traffic Manager percentages mean slower than the speed limit.
  # CAV-2 is deliberately moderate rather than parked: it remains around J2
  # long enough for a 1 Hz UAV controller to take several decisions.
  car3_start_before_junction_m: 70.0
  car3_speed_difference_pct: 35.0
  car3_route_tail_m: 150.0
  transient_coverage_radius_m: 70.0

  # A legal same-lane convoy creates physical line-of-sight occlusion.
  # All actors exist before recording and move continuously under Traffic Manager.
  blocker_role: regional_cav2_blocker
  occlusion_target_roles: [regional_cav2_front_1, regional_cav2_front_2]
  support_vehicles:
    - role: regional_cav2_blocker
      route: j2_cross
      start_offset_m: 48.0
      speed_difference_pct: 42.0
      required: true
      blueprints: [vehicle.mitsubishi.fusorosa, vehicle.mercedes.sprinter, vehicle.carlamotors.european_hgv, vehicle.*]
    - {role: regional_cav2_front_1, route: j2_cross, start_offset_m: 28.0, speed_difference_pct: 38.0, required: true}
    - {role: regional_cav2_front_2, route: j2_cross, start_offset_m: 10.0, speed_difference_pct: 36.0, required: true}
    - {role: regional_cav2_rear, route: j2_cross, start_offset_m: 92.0, speed_difference_pct: 32.0}
    - {role: regional_corridor_1, route: corridor_behind_ego, start_offset_m: 58.0, speed_difference_pct: 48.0}
    - {role: regional_corridor_2, route: corridor_behind_ego, start_offset_m: 83.0, speed_difference_pct: 44.0}
    - {role: regional_corridor_3, route: corridor_behind_ego, start_offset_m: 108.0, speed_difference_pct: 40.0}

  validation:
    early_end_s: 10.0
    late_start_s: 20.0
    minimum_late_targets: 8
    minimum_rescue_frames_per_phase: 2
    minimum_directional_row_shift: 1
    minimum_transient_inside_frames: 4
    minimum_transient_outside_frames: 4
    minimum_transient_exit_shift_m: 30.0
    minimum_occlusion_frames: 3
    minimum_occlusion_rescue_frames: 2
    minimum_targets_per_frame_median: 8
    minimum_missed_instances_per_phase: 5
    minimum_rescuable_instances_per_phase: 3
    minimum_dynamic_extra_rescues: 2
    minimum_dynamic_recall_gain_pp: 1.0
    minimum_dynamic_movement_m: 15.0

  rsu:
    offset_forward_m: 0.0
    offset_right_m: -18.0
    height_m: 7.0

  # 5x5 at 15 m spacing spans 60x60 m. At 15 m/s and 1 Hz, one cardinal
  # grid transition per decision is physically feasible; diagonals need 2 steps.
  uav_grid_offset_forward_m: -5.0
  uav_grid_offset_right_m: 0.0

  bev_margin_m: 30.0
  bev_camera:
    height_m: 165.0
    image_size_x: 1800
    image_size_y: 1500
    fov: 105.0
  save_overhead_rgb: true

grid:
  size: 5
  spacing_m: 15.0
  height_m: 25.0
  keyframe_interval_s: 1.0

sensors:
  vehicle_lidar:
    mount: {x: 0.0, y: 0.0, z: 1.8, pitch: 0.0, yaw: 0.0, roll: 0.0}
    channels: 80
    range: 80.0
    points_per_second: 400000
    rotation_frequency: 10.0
    upper_fov: 15.0
    lower_fov: -25.0
  rsu_lidar:
    channels: 64
    range: 100.0
    points_per_second: 300000
    rotation_frequency: 10.0
    upper_fov: 10.0
    lower_fov: -40.0
  uav_lidar:
    channels: 64
    range: 80.0
    points_per_second: 200000
    rotation_frequency: 10.0
    upper_fov: -5.0
    lower_fov: -90.0

scoring:
  roi_mode: regional_fixed
  regional_roi:
    center_offset_forward_m: 0.0
    center_offset_right_m: 0.0
    forward_m: [-110.0, 110.0]
    right_m: [-60.0, 60.0]
  ego_roi:
    min: [-140.8, -40.0]
    max: [140.8, 40.0]
  base_sensors: [ego_lidar, cav2_lidar, rsu_lidar]
  ignore_roles: [regional_ego, regional_car3]
  threshold_points: {car: 8, pedestrian: 3, two_wheeler: 5}
  class_weights: {car: 1.0, pedestrian: 2.0, two_wheeler: 1.5}
  quality_tau_points: {car: 40.0, pedestrian: 12.0, two_wheeler: 20.0}
  box_margin_m: 0.15
  gain_weight: 0.5

oracle:
  uav_speed_mps: 15.0
  movement_penalty_per_m: 0.01
  recovery_quality_tiebreak: 0.0001
