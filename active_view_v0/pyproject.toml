[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "active-view-v0"
version = "1.0.0"
description = "CARLA active-UAV recovery benchmark with moving traffic occlusion"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.6",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
editor = ["Pillow>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
active_view_v0 = ["regional_editor.html"]
