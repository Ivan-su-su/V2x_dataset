name: Active View tests

on:
  push:
    branches:
      - main
      - codex/fixed-signals-40s
  pull_request:
    paths:
      - "active_view_v0/**"
      - ".github/workflows/active-view-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: active_view_v0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
